<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
rgba(0,29,53,.95),
rgba(0,29,53,.95)
),
url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1920');
background-size:cover;
background-position:center;
overflow:hidden;
}

/* Floating Effects */

body::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:rgba(200,155,99,.15);
border-radius:50%;
top:-100px;
left:-100px;
filter:blur(40px);
animation:float 8s infinite ease-in-out;
}

body::after{
content:'';
position:absolute;
width:250px;
height:250px;
background:rgba(255,255,255,.08);
border-radius:50%;
bottom:-80px;
right:-80px;
filter:blur(40px);
animation:float 10s infinite ease-in-out;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-25px);
}

}

.container{
text-align:center;
color:white;
padding:40px;
position:relative;
z-index:2;
}

.icon{
font-size:80px;
color:#c89b63;
margin-bottom:20px;
animation:bounce 2s infinite;
}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}

.error{
font-size:150px;
font-weight:700;
line-height:1;
color:#c89b63;
text-shadow:0 0 20px rgba(200,155,99,.4);
}

h2{
font-size:34px;
margin:15px 0;
}

p{
color:#ddd;
font-size:17px;
margin-bottom:35px;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:14px 28px;
background:#c89b63;
color:white;
text-decoration:none;
border-radius:50px;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:white;
color:#001d35;
transform:translateY(-3px);
}

@media(max-width:600px){

.error{
font-size:100px;
}

h2{
font-size:26px;
}

.buttons{
flex-direction:column;
align-items:center;
}

}

</style>
</head>

<body>

<div class="container">

<div class="icon">
<i class="fas fa-map-signs"></i>
</div>

<div class="error">
404
</div>

<h2>
Oops! Page Not Found
</h2>

<p>
The page you are looking for doesn't exist,
has been moved, or the link is broken.
</p>

<div class="buttons">

<a href="javascript:history.back()" class="btn">
<i class="fas fa-arrow-left"></i>
Previous Page
</a>

<a href="home.html" class="btn">
<i class="fas fa-home"></i>
Back To Home
</a>

</div>

</div>

</body>
</html>
